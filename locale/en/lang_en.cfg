[entity-description]
ei-cargo-bot=A slow cargo bot capable of carrying a lot of items.
ei-construction-bot=Fast construction bot.
ei-advanced-logistic-bot=Highly advanced logistic bot. Fast, long range and can carry more items.
ei-advanced-construction-bot=Highly advanced construction bot. Fast, long range and can carry more items.
nuclear-reactor=Uses uranium fuel cells to generate heat. The heat output does NOT increase when built next to other reactors.
ei-crystal-accumulator=The crystal radiates energy. Seems to be unstable for long periods of time, mining it will result in a broken device. 
ei-crystal-accumulator-gaia=The crystal radiates energy. Seems to be stable for long periods of time.
ei-resonance-synthesizer=Multiplies [item=ei-resonance-data] resonance data: 1 piece, [fluid=ei-morphium] morphium and [fluid=ei-computing-power] computing power make 2. Later also crafts the [item=ei-alien-resonance-pack] alien resonance pack (only on Gaia). Computing power: data cable on the east side, morphium: pipe on the west side.
ei-data-center=Crafts [color=orange]any science pack[/color] - including packs of other mods - from [fluid=ei-computing-power] computing power only, about ten times slower than regular production.
ei-conduit=A lightning attractor that turns [color=orange]80 %[/color] of every captured strike into electricity (40 MJ buffer, up to 5 MW output). Strikes it catches cannot cause a storm EMP.
ei-void-rift-generator=Tears a 5x5 [color=purple]void rift[/color] (out-of-map) open right south of itself - the rift [item=ei-void-engine] void engines need. The area must be free. Removing the generator closes the rift and restores the original terrain.
ei-data-pipe-to-ground=Underground version of the [item=ei-data-pipe] data cable. Only carries [fluid=ei-computing-power] computing power.
ei-orbital-combinator=Mirrors the logistic requests of every space platform orbiting this planet as signals. Needs [color=blue]1 computing power per minute[/color] [fluid=ei-computing-power] through a data cable while a platform has requests - without it the signals freeze.
ei-conduit-gaia=A dormant pylon of the lost civilization that still draws Gaia's lightning to itself - build in its shadow.
ei-radio-station=Sends the circuit network wired to it to every receiver on the same channel of this surface, or outputs the channel it receives. A channel is any signal; one transmitter per channel, any number of receivers. Uses [color=orange]100 kW[/color].
ei-crystal-radio-station=A radio station whose resonating crystals reach every surface of the game: channels are shared between all planets and platforms. Uses [color=orange]10 MW[/color].
ei-1x1-container=Compact 1x1 container for bulk storage of anything the colony produces.
ei-1x1-container-filter=Compact 1x1 container with filtered slots that only accept what you allow.
ei-1x1-container-blue=Compact 1x1 container that requests items from the logistic network.
ei-1x1-container-green=Compact 1x1 container that buffers requested items for robots and players.
ei-1x1-container-pink=Compact 1x1 container that actively pushes its contents into the logistic network.
ei-1x1-container-red=Compact 1x1 container that offers its contents to the logistic network.
ei-1x1-container-yellow=Compact 1x1 container where logistic robots store surplus items.
ei-2x2-container=Sturdy 2x2 storebox for bulk storage of anything the colony produces.
ei-2x2-container-filter=Sturdy 2x2 storebox with filtered slots that only accept what you allow.
ei-2x2-container-blue=Sturdy 2x2 storebox that requests items from the logistic network.
ei-2x2-container-green=Sturdy 2x2 storebox that buffers requested items for robots and players.
ei-2x2-container-pink=Sturdy 2x2 storebox that actively pushes its contents into the logistic network.
ei-2x2-container-red=Sturdy 2x2 storebox that offers its contents to the logistic network.
ei-2x2-container-yellow=Sturdy 2x2 storebox where logistic robots store surplus items.
ei-6x6-container=Massive 6x6 storehouse for bulk storage of anything the colony produces.
ei-6x6-container-filter=Massive 6x6 storehouse with filtered slots that only accept what you allow.
ei-6x6-container-blue=Massive 6x6 storehouse that requests items from the logistic network.
ei-6x6-container-green=Massive 6x6 storehouse that buffers requested items for robots and players.
