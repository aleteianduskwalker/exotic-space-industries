[entity-name]
ei-fueler=Башня автозаправки

[item-description]
ei-fueler=Автоматическая [color=orange]заправочная башня[/color]. Заправляет поезда, автомобили и танки, а также их [color=blue]сетки модулей[/color] и ячейки боеприпасов турелей. Подробности — во внутриигровой вики Informatron.

[mod-setting-name]
ei-fueler_max_updates_per_tick=Максимум обновлений заправщиков за тик
ei-fueler_range=Радиус заправочной башни

[mod-setting-description]
ei-fueler_max_updates_per_tick=Количество обновлений за тик. Заправочные башни обновляются по кругу. Большее число означает, что больше башен обновится за меньшее время, но производительность снизится. Если башни заправляют только неподвижные цели, значения по умолчанию достаточно.
ei-fueler_range=Больший радиус позволяет находить более дальние цели, но производительность снизится, так как башням придётся сканировать большие области.

[technology-name]
ei-fueler=Заправочная башня

[technology-description]
ei-fueler=Заправочные башни заправляют транспорт, паукотронов, поезда и сетки модулей транспорта/игрока в своём радиусе. Башня переносит предметы из своего инвентаря в топливные инвентари поблизости. За раз заправляется только один тип целей. Тип цели задаётся в интерфейсе, который открывается при нажатии на башню. Можно заправлять либо потребителей топлива в сетке модулей, либо сам транспорт. Башня также забирает всё отработанное топливо в свой инвентарь, если возможно.

