fueler-gui-control-description-tooltip=Выберите тип целей для заправки. Поезда других модов поддерживаются типом «локомотив», автомобили и танки других модов — типом «автомобиль». То же для всех видов паукотронов.
fueler-gui-equipment-description=[font=default-bold]Куда заправлять[/font] [img=info]
fueler-gui-equipment-description-tooltip=Заправлять транспорт или его сетку модулей?

vehicle=Только транспорт
equipment=Только сетки модулей

[exotic-industries-fueler-informatron]
menu_exotic-industries-fueler-informatron=Заправочная башня
title_exotic-industries-fueler-informatron=Заправочная башня

welcome=Exotic Industries: Заправщик
welcome-text=Заправочная башня — машина, заправляющая транспорт, паукотронов, поезда и сетки модулей транспорта/игрока в своём радиусе. Башня переносит предметы из своего инвентаря в топливные инвентари поблизости. За раз заправляется только один тип целей. Тип цели задаётся в интерфейсе, который открывается при нажатии на башню. Можно заправлять либо потребителей топлива в сетке модулей, либо сам транспорт. Башня также забирает всё отработанное топливо в свой инвентарь, если возможно.

welcome-text-2=Эти башни могут заправлять и движущиеся цели, например едущие поезда. Нагрузка мода на производительность не зависит от числа башен — вместо этого снижается частота их обновления. Частоту обновления и радиус башен можно изменить в настройках мода. Значений по умолчанию достаточно для всех неподвижных целей. Если цели движутся, а башен много, башня может не успеть заправить проезжающий поезд.

[entity-description]
ei-fueler=Автоматическая [color=orange]заправочная башня[/color]. Заправляет поезда, автомобили и танки, а также их [color=blue]сетки модулей[/color] и ячейки боеприпасов турелей. Подробности — во внутриигровой вики Informatron.
