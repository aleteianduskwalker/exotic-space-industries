[technology-description]
ei_em-trains=ЭМ-поезда — новый тип поездов с полевой тягой. Они быстрее и эффективнее. Ставьте зарядники в радиусе действия, чтобы поезда продолжали ехать.

[item-description]
ei_charger=Заряжает ЭМ-поезда в радиусе действия. Каждая зарядка потребляет энергию. Улучшается исследованиями. Потребляет 10 МВт в простое. Нужно 250 Вт на каждый рельс в радиусе.
ei_em-locomotive=ЭМ-локомотив. Быстрее и эффективнее обычных локомотивов. Для работы нужен действующий зарядник в радиусе.
ei_em-cargo-wagon=ЭМ-грузовой вагон. 60 ячеек для предметов.
ei_em-fluid-wagon=ЭМ-цистерна. Перевозит 50 тыс. единиц жидкости.

