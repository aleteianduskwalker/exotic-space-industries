ei-burner-quarry=Грубый карьер на твёрдом топливе, вгрызающийся в скалу ради камня и первых руд.
ei-electric-quarry=Электрический карьер, перемалывающий коренную породу и никогда не истощающийся.
ei-steam-miner=Лязгающий паровой бур для первых дней колонии.
ei-steam-oil-pumpjack=Простая паровая качалка, поднимающая первую сырую нефть.
ei-superior-electric-mining-drill=Вершина буровой техники, вытягивающая руду из земли с бешеной скоростью.
ei-cannon-turret=Тяжёлая турель, забрасывающая снарядами любого, кто рискнёт приблизиться.
ei-plasma-turret=Турель, выплёвывающая сгустки удерживаемой плазмы, плавящие броню при касании.
ei-coke-furnace=Кирпичная печь, запекающая уголь и древесину в плотный, жарко горящий кокс.
ei-heat-steel-furnace=Стальная печь, которую греют тепловые трубы вместо топлива.
ei-exchanger=Теплообменник, превращающий воду в критический пар с помощью жидкого свинца из термоядерных реакторов.
ei-loader=Погрузчик, перемещающий предметы напрямую между конвейером и контейнером.
ei-fast-loader=Быстрый погрузчик для пропускной способности красного конвейера.
ei-express-loader=Экспресс-погрузчик для пропускной способности синего конвейера.
ei-neo-loader=Погрузчик, рассчитанный на бешеную скорость нео-конвейеров.
ei-neo-belt=Высокотехнологичный конвейер, перемещающий 90 предметов в секунду.
ei-neo-splitter=Разделитель, поспевающий за нео-конвейерами.
ei-neo-underground-belt=Подземный конвейер с пропускной способностью нео-конвейера.
ei-neo-assembler=Сборщик из экзотических сплавов, работающий быстрее всего, что было построено раньше.
ei-farstation=Восстановленная Дальстанция, передающая энергию на огромные расстояния.
