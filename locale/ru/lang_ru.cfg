[technology-description]
ei-dark-age=Первая эпоха мода Exotic Industries. Первая автоматизация на твёрдом топливе.
ei-steam-age=Вторая эпоха мода Exotic Industries. Автоматизируйте базу машинами на паровой тяге и двигайтесь дальше.
ei-electricity-age=Третья эпоха мода Exotic Industries. Обуздайте электричество и переходите к более сложной химической переработке.
ei-computer-age=Четвёртая эпоха мода Exotic Industries. Компьютерные системы позволят ещё больше повысить эффективность фабрики и автоматизировать более сложные задачи.
ei-quantum-age=Пятая эпоха мода Exotic Industries. Вас ждут термоядерный синтез и высокотехнологичные машины!
ei-exotic-age=Шестая и последняя эпоха мода Exotic Industries. Победите, завершив строительство суперструктуры.

ei-steam-oil-processing=Освойте простую нефтепереработку и используйте её для базовой химии или производства топлива.
ei-electricity-power=Освойте простое производство электроэнергии и питайте им свои машины.
ei-destill-tower=Разделение нефти на компоненты.
ei-computer-core=Освойте простую компьютерную автоматизацию.
ei-big-lab=Улучшенные лаборатории нужны для исследования более сложных технологий.
ei-induction-matrix=Индукционная матрица — огромная мультиструктура для хранения энергии. Подробности — в вики InformaTron.
ei-neodym-refining=Переработка неодимовой руды в неодимовые слитки. Они необходимы для высокотехнологичных машин.
ei-deep-mining=Освойте глубинную добычу, чтобы получать больше ресурсов, в том числе те, что встречаются только в глубоких слоях Наувиса.
ei-moon-exploration=Добудьте лунную рыбу и начните освоение космоса.
ei-quantum-computer=Освойте автоматизацию на квантовых компьютерах.
ei-fluid-boiler=Сжигает [color=orange]горючие жидкости[/color] для получения пара. К [color=orange]горючим жидкостям[/color] относятся нефть, нефтепродукты и вообще жидкости с топливной ценностью.
ei-small-inserter=Манипулятор 2x2 с ячейками фильтра. Переносит целые стопки предметов за раз.
ei-big-inserter=Манипулятор 2x2 с ячейками фильтра. Переносит целые стопки предметов за раз с высокой скоростью.

ei-crystal-accumulator-repair=Ремкомплекты, восстанавливающие кристаллические аккумуляторы древних.
ei-bio-chamber=Выращивайте инопланетные семена и используйте их для производства биоусиленных пластин. Первые семена можно получить, уничтожая инопланетные цветы. \n\n 
ei-gate=Открывает канал мгновенной переброски предметов между Гайей и другими мирами.
ei-bio-energy-crystal=Выращивайте энергетические кристаллы из биоматерии.
ei-bio-insulated-wire=Выращивайте изолированный провод из биоматерии.
ei-bio-high-energy-crystal=Выращивайте высокоэнергетические кристаллы из биоматерии.
ei-bio-electronic-parts=Выращивайте электронные компоненты из биоматерии.
ei-bio-hydrofluoric-acid=Получайте плавиковую кислоту с помощью биоматерии.
ei-bio-nitric-acid=Получайте азотную кислоту с помощью биоматерии.
ei-farstation-repair=Ремкомплекты, восстанавливающие древние Дальстанции.
ei-farstation=Стройте новые Дальстанции, передающие энергию на большие расстояния.
ei-alien-beacon-repair=Ремкомплекты, пробуждающие сломанные инопланетные маяки.
ei-bio-carbon-structure=Выращивайте углеволоконный композит из биоматерии.
ei-bio-magnet=Выращивайте магниты из биоматерии.
ei-bio-rocket-fuel=Связывайте ракетное топливо биоматерией.
ei-resonance-synthesizer=Приумножайте [item=ei-resonance-data] резонансные данные с помощью морфиума и вычислительной мощности. От этой технологии зависят все технологии инопланетного древа.
ei-resonant-computation=Инопланетное древо технологий, уровень 4. Открывает [item=ei-alien-resonance-pack] инопланетный резонансный пакет и [item=ei-data-pipe-to-ground] подземный кабель данных.
ei-threshold-engineering=Инопланетное древо технологий, уровень 5. Открывает [item=ei-void-rift-generator] генератор разлома пустоты.
ei-data-center=Здание, производящее любой исследовательский пакет из вычислительной мощности.
ei-alien-tree-trigger=Открывается за инопланетные знания в инопланетном древе технологий (InformaTron -> Инопланетное древо технологий), а не в лаборатории.
ei-conduit=Восстановите древние молниеотводы Гайи и соберите энергию шторма.
ei-radio-station=Беспроводные каналы сети сигналов между станциями одной поверхности.
