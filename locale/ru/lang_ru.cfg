# PAGES
welcome=Добро пожаловать в Exotic Industries!
welcome-text=Это вики-страница. Здесь вы найдёте информацию о моде, его особенностях и механиках. Новые открытия могут добавлять сюда новые статьи, так что заглядывайте время от времени. Если у вас есть вопросы или проблемы, задавайте их на discord-сервере мода — ссылка есть в описании мода на портале модов.
welcome-text-2=Вас ждёт множество новых машин, производственных цепочек и уникальных особенностей — какие-то простые, какие-то посложнее. Обязательно исследуйте их! 

game-related=Информация об игровом процессе
game-related-text=В этом разделе собрана информация об игровых особенностях и механиках мода. Он разбит на несколько подразделов — они в меню слева.

overall=Общая информация
overall-text=Exotic Industries — мод-переработка, затрагивающий или полностью переделывающий почти все аспекты ванильной Factorio. Встроенной интеграции с другими крупными модами вроде Krastorio 2 или SE, конечно, нет. Рекомендуемые моды из официальной сборки уже совместимы с Exotic Industries. Для лучших впечатлений используйте их вместе с модами удобства на свой вкус. Перед новой игрой обязательно проверьте настройки мода — многие важные аспекты можно настроить там.

biters=Кусаки и враги
biters-text=Враги в Exotic Industries играют второстепенную роль. В начале игры они могут стать угрозой, если строить очень медленно и не следить за загрязнением. Но мод не добавляет новых или более сильных врагов, поэтому с развитием справляться с кусаками становится проще. В поздней игре у вас будут сильные военные средства. Возможно, стоит заранее увеличить стартовую область. В официальной сборке рекомендованы некоторые моды на базы кусак.

ages-and-tech=Эпохи технологий
ages-and-tech-text=Exotic Industries охватывает несколько эпох технологий. У каждой эпохи свои особенности и механики. 

ages-and-tech-2=Тёмная эпоха, эпохи пара, электричества, компьютеров, квантовая и экзотическая
ages-and-tech-text-2=Мод разделён на шесть эпох. Тёмная эпоха очень короткая и ведёт к первой паровой фабрике. Нефть доступна рано и может служить топливом или защитой от кусак. С постройкой первых электронных устройств начинается эпоха электричества: становятся доступны разные источники энергии, появляются роботы и ядерное деление. Компьютерная эпоха вводит маяки и модули. Высокотехнологичные машины становятся доступны в квантовую эпоху. И наконец, экзотическая эпоха позволит вам победить.

tech=Изменения в технологиях
tech-text=Exotic Industries меняет стоимость технологий: все они начинаются с минимальной цены и дорожают по мере продвижения по древу. Это позволяет при желании рвануть к нужным технологиям. Масштабирование стоимости и минимальное/максимальное значения настраиваются в настройках мода. Форма кривой влияет не на цену последней технологии, а на рост к ней. Если играете в EI впервые, оставьте линейное масштабирование. Если хотите использовать множитель науки, НЕ используйте ванильный — используйте настройки мода. 



world-gen-related=Информация о мире
world-gen-related-text=В этом разделе собрана информация о генерации мира и связанных механиках. Он разбит на несколько подразделов — они в меню слева.


resources=Новая система ресурсов
resources-text=Exotic Industries вводит новую систему ресурсов. Вместо одних лишь рудных месторождений ресурсы разделены на несколько категорий.


veins=Глубинные рудные жилы
veins-text=Рудные жилы доступны только позже, с помощью [color=orange]глубинных буров[/color] [item=ei-deep-drill]. Они дают большой выход и лучшие пропорции плавки. Некоторые материалы — уран, свинец, золото и неодим — добываются только из этих жил.

artifacts=Инопланетные артефакты
artifacts-text=Древняя цивилизация, обуздавшая силу экзотической материи, оставила после себя артефакты. Они разбросаны по всему миру, и некоторые из них могут даже работать. Но будьте осторожны: возможно, их не трогали не просто так...


gate=Междумерные врата
gate-text=Врата позволяют перемещаться сквозь пространство. Сами врата потребляют до [color=orange]50 МВт[/color], и эту мощность нужно подавать, чтобы они работали. Если мощность упадёт ниже, врата отключатся. Через врата можно переносить только неживые объекты. Для успешной передачи предметов выход врат должен указывать на какой-либо [color=orange]контейнер[/color][item=wooden-chest][item=iron-chest]. Передача предметов расходует энергию из внутреннего буфера врат.


repair=Ремонт артефактов
repair-text=Сломанные инопланетные артефакты можно отремонтировать, изготовив [color=blue]ремкомплекты артефактов[/color][item=ei-crystal-accumulator-repair][item=ei-farstation-repair][item=ei-alien-beacon-repair][item=ei-alien-console-repair]. После этого ими снова можно пользоваться. Ремонт начинается, если провести ремкомплектом над артефактом; ремкомплект при этом расходуется. Каждый ремонт даёт [color=#d43e8e]инопланетные знания[/color] для инопланетного древа технологий. Сломанные руины можно и разобрать: добыча, разбор роботами или уничтожение на Гайе дают десятую часть этих знаний и немного высокоуровневых ресурсов. Неотремонтированные руины неуязвимы для молний.

alien=Древние инопланетные данные

new-logistics=Новая логистика
new-logistics-text=Exotic Industries добавляет и новые логистические возможности. Они разбиты на несколько подразделов — они в меню слева.

train-progression=Развитие поездов
train-progression-text=Поезда доступны уже в начале эпохи пара. Сначала можно построить только простой [color=orange]паровоз[/color] [item=ei-steam-basic-locomotive], перевозящий предметы, но не жидкости. [color=orange]Улучшенный паровоз[/color] [item=ei-steam-advanced-locomotive] перевозит и жидкости. Оба работают на горючем топливе, например угле. Позже для более мощных [color=orange]дизельных локомотивов[/color] [item=locomotive] понадобится [color=brown]дизельное топливо[/color] [item=ei-diesel-fuel-unit].

spidertron=Изменения паукотрона
spidertron-text=В отличие от ванилы, паукотрон доступен уже в начале компьютерной эпохи, но ему нужно топливо. Поначалу хорошо подходит горючее топливо, а позже ядерное или термоядерное даёт паукотрону хорошие бонусы к скорости и ускорению. Кроме того, моды вроде [color=green]Spidertron Patrols[/color] и [color=green]Constructron-Continued[/color] имеют специальную интеграцию с этими изменениями.

cranes-and-belts=Новые конвейеры и краны-манипуляторы
cranes-and-belts-text=Exotic Industries добавляет новый уровень конвейеров — [color=orange]нео-конвейер[/color] [item=ei-neo-belt] из высокотехнологичных материалов с пропускной способностью 90 предметов/с. Кроме того, мод добавляет большие манипуляторы — [color=orange]краны[/color] [item=ei-big-inserter-normal]. Ими можно быстро разгружать поезда или перекладывать предметы между сундуками и складами. 

bots=Больше роботов
bots-text=Если вы играете с модом Exotic Industries Bots, вам будут доступны специализированные и улучшенные роботы, а также новый робопорт.


new-mechanics=Новые игровые механики
new-mechanics-text=Exotic Industries добавляет много новых механик. Они разбиты на несколько подразделов — они в меню слева.

beacon-overhaul=Переработка маяков
beacon-overhaul-text=Exotic Industries ограничивает число маяков, одновременно влияющих на машину, максимум 4. Кроме того, маякам теперь нужна охлаждающая жидкость. Зато они вмещают больше модулей, а улучшенный маяк считается за 2 маяка в лимите, но вмещает ещё больше модулей.

specialised-pipes=Специализированные трубы и кабели данных
specialised-pipes-text=Exotic Industries вводит специализированные трубы и кабели данных. [color=orange]Изолированные трубы[/color] нужны для транспортировки очень холодных [fluid=ei-liquid-oxygen][fluid=ei-liquid-nitrogen] или очень горячих [fluid=ei-heated-helium-3] жидкостей, чтобы сохранить их жидкую фазу — в обычных трубах они превращаются в газ. [color=orange]Кабели данных[/color] передают данные между машинами. Они нужны для работы новых машин — [color=orange]компьютера[/color] [item=ei-computer-core] и [color=orange]квантового компьютера[/color] [item=ei-quantum-computer].



induction-matrix=Индукционная матрица
induction-matrix-text=[color=orange]Индукционная матрица[/color] — составная машина для хранения больших объёмов энергии. Как и обычные аккумуляторы, она запасает избыточную энергию и отдаёт её позже. Разные уровни размера матрицы открываются соответствующими технологиями.

induction-matrix-2=Компоненты индукционной матрицы
induction-matrix-2-text=Индукционная матрица состоит из нескольких компонентов. [color=orange]Ядро индукционной матрицы[/color] [item=ei-induction-matrix-core] — её главный компонент. [color=orange]Индукционные катушки[/color] [item=ei-induction-matrix-basic-coil][item=ei-induction-matrix-advanced-coil][item=ei-induction-matrix-superior-coil] хранят энергию. Их можно улучшать, и они получают бонус рядом с [color=orange]соленоидом матрицы[/color] [item=ei-induction-matrix-basic-solenoid]. Соленоиды эффективнее при последовательной установке, но не переусердствуйте. [color=orange]Преобразователи[/color] [item=ei-induction-matrix-basic-converter][item=ei-induction-matrix-advanced-converter][item=ei-induction-matrix-superior-converter] увеличивают объём энергии, который можно передать в матрицу и из неё.

exotic-stabilizers=Стабилизаторы экзотической материи
exotic-stabilizers-text=Экзотическую материю очень трудно обрабатывать. Нужна специальная машина, способная выдержать её высокую энергию, — [color=orange]сборщик экзотической материи[/color] [item=ei-exotic-assembler]. Но и такие машины иногда нестабильны и могут взорваться. Чтобы этого не случилось, ставьте вокруг сборщика [color=orange]стабилизаторы экзотической материи[/color] [item=ei-matter-stabilizer]. Возможно, их даже удастся найти в мире.

black-hole=Генератор чёрной дыры
black-hole-text=Могучий [color=orange]генератор чёрной дыры[/color] способен извлекать энергию из самой материи. Постройка этой машины и вывод её в [color=green]полностью работоспособное[/color] состояние приносят победу. Для этого понадобится много строительных материалов, стабильная подача расходуемой материи и огромная мощность. Поэтому заранее обзаведитесь хорошей инфраструктурой [color=orange]термоядерных реакторов[/color] или мощными [color=orange]индукционными матрицами[/color].

black-hole-2=Компоненты реактора
black-hole-2-text=Генератор состоит из нескольких компонентов. [color=orange]Генератор чёрной дыры[/color] [item=ei-black-hole] — главное здание: после активации он поглощает любые предметы из инвентаря и добавляет их к внутренней [color=green]массе[/color]. Масса внутри чёрной дыры со временем распадается. Тип предмета не важен — каждый даёт одинаковую прибавку массы. [color=orange]Пилоны инжекции энергии[/color] [item=ei-energy-injector-pylon] поддерживают удерживающее поле чёрной дыры. Каждый пилон потребляет 5 ГВт, но на стадии запуска они не нужны: чёрная дыра ещё мала и удерживается самим корпусом реактора. [color=orange]Пилоны извлечения энергии[/color] [item=ei-energy-extractor-pylon] извлекают до 100 ГВт каждый — это возможно только в полностью работоспособной стадии.

black-hole-3=Стадии чёрной дыры
black-hole-3-text=Запуск реактора проходит в несколько этапов. На стадии запуска пилоны не нужны — нужно лишь набрать начальную массу [color=blue]10x10^3 кг[/color]. При 100% прогресса стадии генератор переходит в следующее состояние. Дальше в любой момент должны работать [color=blue]8 активных пилонов инжекции[/color] [item=ei-energy-injector-pylon]. Кнопка расширения запускает рост радиуса чёрной дыры. В этом состоянии реактор должен проработать [color=blue]60 с[/color], чтобы стать полностью работоспособным. После этого [color=orange]пилоны извлечения энергии[/color] [item=ei-energy-extractor-pylon] в радиусе действия могут извлекать энергию и отдавать её в вашу сеть. Мощность огромна, поэтому генератор почти самодостаточен — ему нужна лишь постоянная подача массы. 

nuclear-fission-and-fusion=Ядерное деление и синтез
nuclear-fission-and-fusion-text=Exotic Industries добавляет новые возможности ядерной энергетики. Они разбиты на несколько подразделов — они в меню слева.

fission-reactors=Изменения ядерного деления
fission-reactors-text=В этом моде изменена энергетика деления. [color=orange]Ядерный реактор[/color] [item=nuclear-reactor] больше не получает бонус соседства, зато его выходная мощность увеличена. Уран добыть сложнее, чем в ваниле. Переработка отработанных топливных элементов позволяет снова использовать продукты деления в новых элементах для большей эффективности. С [color=brown]ядерными отходами[/color] [item=ei-nuclear-waste] придётся что-то делать.

fission-reactors-2=Высокотемпературное деление
fission-reactors-2-text=[color=orange]Высокотемпературный ядерный реактор[/color] [item=ei-high-temperature-reactor] — новый реактор деления, вырабатывающий ещё больше энергии. Нагретый до рабочей температуры и снабжённый огромным количеством воды и топливным стержнем, он производит много пара эффективнее теплообменников. Он даже может использовать иначе неделящееся [color=brown]ториевое[/color] [item=ei-thorium-232-fuel] топливо.

fusion-power=Термоядерная энергия
fusion-power-text=[color=orange]Термоядерный реактор[/color] [item=ei-fusion-reactor] — новая машина, вырабатывающая огромное количество энергии за счёт синтеза лёгких атомов. Он охлаждается циклом [color=orange]свинцового теплоносителя[/color] [fluid=ei-cold-coolant][fluid=ei-hot-coolant]. Реактор довольно дорог и требует постоянной подачи топлива. В начале лучшие варианты топлива — [color=blue]литий[/color] и [color=blue]протий[/color]. Позже можно использовать [color=blue]дейтерий[/color] и [color=blue]тритий[/color] или даже [color=blue]гелий-3[/color].

fusion-power-2=Нейтроны и вы
fusion-power-2-text=Для получения улучшенного термоядерного топлива можно использовать [color=green]нейтроны[/color]. Их дают нейтронные источники [color=green]ядерного деления[/color] и [color=green]синтеза[/color], а улавливать их нужно [color=orange]нейтронными коллекторами[/color] [item=ei-neutron-collector]. В зависимости от интенсивности источника и расстояния до коллектора нейтронов будет больше или меньше.
menu_gaia_hub=Гайя: узел
title_gaia_hub=Гайя: узел
tier=Уровень __1__
alien-text=Древняя цивилизация, оставившая артефакты, оставила и часть своих знаний. [color=#d43e8e]Инопланетные знания[/color] открывают технологии этого древа — в лаборатории их не исследовать, но они видны в окне технологий за [technology=ei-resonance-synthesizer] резонансным синтезатором, который нужно изучить сначала. Каждый отремонтированный артефакт даёт 100 знаний; добыча, разбор роботами или уничтожение сломанной руины на Гайе даёт 10 и вместо самой руины — немного высокоуровневых ресурсов. Когда древо изучено полностью, знания больше не начисляются. Узлы покупаются у [item=ei-alien-console] инопланетного терминала на Гайе: почините разбитый терминал из руин или откройте узел терминала (единственный узел, который можно купить где угодно). Терминал также превращает положенные в него резонансные пакеты и данные в знания. Если знаний не хватает, из инвентаря берутся [item=ei-alien-resonance-pack] инопланетные резонансные пакеты (10 знаний за штуку), а затем [item=ei-resonance-data] резонансные данные (10 штук за 1 знание). Уровень открывается, когда открыты все узлы предыдущего уровня; уровни 4 и 5 дополнительно забирают резонансные данные и инопланетные резонансные пакеты. Серый: доступно, красный: заблокировано, зелёный: открыто.
alien-balance=Инопланетные знания: [color=#d43e8e]__1__[/color]
alien-cost=Стоимость: [color=#d43e8e]__1__[/color] инопланетных знаний
alien-cost-item=+ __1__ x [item=__2__]
alien-locked-hint=Ваша фракция ещё не получила инопланетных знаний. Разберите сломанную инопланетную руину на Гайе или отремонтируйте артефакт ремкомплектом, чтобы пробудить древние данные.
resonance=Резонансные данные
resonance-text=Каждый отремонтированный артефакт рассыпает вокруг себя 2-4 [item=ei-resonance-data] резонансных данных — подберите их. Руин конечное число, поэтому [item=ei-resonance-synthesizer] резонансный синтезатор их приумножает: из 1 резонансных данных, [fluid=ei-morphium] морфиума и [fluid=ei-computing-power] вычислительной мощности получается 2. Резонансные данные нужны для [item=ei-alien-resonance-pack] инопланетного резонансного пакета, который можно производить только на Гайе.
gaia-hub=Гайя: узел, а не мегабаза
gaia-hub-text=На Гайе нет пригодного солнечного света, постройки без обогрева замерзают, а магнитные штормы бьют вдвое чаще. Раскидистому производству там тяжело, зато компактный узел процветает: сеть врат обязана проходить через Гайю, там производится инопланетная наука, а исследовательские пакеты, артефакты и данные удобно раздавать оттуда по всей системе.
storm=Штормы: ЭМИ и проводник
storm-text=Удар молнии на Гайе, не пойманный молниеотводом, вызывает [color=red]ЭМИ[/color]: машины, манипуляторы и комбинаторы вокруг места удара останавливаются на несколько секунд (значения в сети не меняются). По Гайе разбросаны древние [entity=ei-conduit-gaia] проводники, притягивающие удары, — стройте первые аванпосты рядом с ними. [item=ei-conduit] [color=orange]Проводник[/color] (инопланетное древо, уровень 1) тоже притягивает удары и превращает 80 % их энергии в электричество — чем больше проводников защищает узел, тем меньше ему мешает шторм. ЭМИ можно отключить в настройках карты.
data-center=Дата-центр
data-center-text=[item=ei-data-center] [color=orange]Дата-центр[/color] производит любой известный игре исследовательский пакет — в том числе пакеты других модов и инопланетные — только из [fluid=ei-computing-power] вычислительной мощности. Каждый рецепт делает ровно один пакет и требует [color=blue]1 вычислительную мощность за каждый уникальный компонент[/color] всей цепочки производства пакета (100, если цепочка слишком велика для анализа). Примерно в десять раз медленнее обычного производства: это запасной клапан, а не замена. Открывается на 4-м уровне инопланетного древа технологий.
orbital-combinator=Сканер запросов платформ
orbital-combinator-text=[item=ei-orbital-combinator] Сканер запросов платформ отражает логистические запросы платформ на орбите его планеты. Ему нужна [color=blue]1 единица вычислительной мощности в минуту[/color] [fluid=ei-computing-power] через кабель данных, но только пока платформа действительно что-то запрашивает. Без вычислительной мощности появляется значок предупреждения, а сигналы замирают на последних значениях.
void-rift=Генератор разлома пустоты
void-rift-text=[item=ei-void-engine] Двигателю пустоты (инопланетный уровень 5) нужен разлом пустоты (клетки края карты) в радиусе 30 клеток. Он встречается в редких руинах, но [item=ei-void-rift-generator] генератор разлома пустоты (инопланетный уровень 5) разрывает разлом 5x5 прямо к югу от себя. Область должна быть свободна; снос генератора восстанавливает рельеф.
alien-requires-technology=[color=red]Требуется исследование:[/color] [technology=__1__]
alien-balance-items=В инвентаре: __1__ [item=ei-alien-resonance-pack] (10 знаний за штуку) и __2__ [item=ei-resonance-data] (10 штук за 1 знание) — тратятся автоматически, когда знаний не хватает.
menu_radio_stations=Радиостанции
title_radio_stations=Радиостанции
radio-stations=Радиостанции
radio-stations-text=[item=ei-radio-station] [color=orange]Радиостанция[/color] связывает сети сигналов без проводов. Выберите любой сигнал как [color=blue]канал[/color] и переключите станцию в режим [color=orange]передатчика[/color] или [color=orange]приёмника[/color]. На канале ровно один передатчик и сколько угодно приёмников: передатчик отправляет подключённые к нему красную и зелёную сети, приёмники выдают эти сигналы в свою сеть. Обычные станции (100 кВт) достают только до станций той же поверхности; [item=ei-crystal-radio-station] кристаллическая радиостанция (10 МВт, 4-й уровень инопланетного древа) достаёт до любой поверхности игры — у двух видов раздельные каналы. Без питания станция не передаёт и не принимает. Настройки копируются через копирование/вставку; не заводите приёмник обратно в его же передатчик — получится петля обратной связи.
menu_drones=Дроны
title_drones=Дроны
drones=Порт дронов и дроны
drones-text=[item=ei-drone-port] [color=orange]Порт дронов[/color] (инопланетное древо, уровень 2) хранит [item=ei-drone] дронов и ремкомплекты — его ячейки можно фильтровать — и назначает задачи в панели рядом с инвентарём. Выберите задачу, нажмите [color=orange]Выбрать цель[/color] и укажите цель [item=ei-drone-remote] пультом дронов. Каждая задача занимает одного дрона: [color=blue]Разбор[/color] — один нейтральный объект (сломанные руины на Гайе, как обычно, дают инопланетные знания), [color=blue]Добыча[/color] — месторождение, как игрок, с доставкой в выбранный контейнер, [color=blue]Перенос[/color] — ровно один предмет из контейнера или врат в другой контейнер, [color=blue]Охрана зоны[/color] — ремонт построек небольшой зоны в выбранном порядке классов (турели, стены, прочее), затем самые повреждённые. Дроны несут 50 предметов, летают над всем, неуязвимы и работают до 64 клеток от порта на его поверхности. Каждый вылет берёт энергию порта — без питания дроны ждут. Дронов можно отозвать в любой момент.
gate-calibration=Калибровка
gate-calibration-text=Прежде чем предметы впервые отправятся на планету, сеть врат нужно откалибровать на неё [color=orange]образцом породы[/color] этой планеты. Образцы дробятся из местного сырья и производятся только на своей планете: [item=ei-planet-sample-vulcanus] Вулкан, [item=ei-planet-sample-gleba] Глеба, [item=ei-planet-sample-fulgora] Фульгора, [item=ei-planet-sample-aquilo] Аквило, [item=ei-planet-sample-gaia] Гайя. Образец берётся из вашего инвентаря или из врат при установке выхода (или при включении врат), и каждая планета калибруется для силы только один раз. Для Нувиса образец не нужен. Для космических платформ тоже, но они доступны, только пока висят над Гайей. Модовые планеты не могут быть выходами врат, пока патч совместимости не задаст их образец. Гайя — узел сети: врата вне Гайи ведут только на Гайю.
alien-console-near=[img=utility/check_mark_green] Инопланетный терминал рядом: узлы можно покупать.
alien-console-far=[img=utility/warning_icon] В пределах __1__ клеток нет инопланетного терминала: здесь можно купить только узел терминала.

