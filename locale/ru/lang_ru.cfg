[entity-description]
ei-cargo-bot=Медленный грузовой робот, способный переносить много предметов.
ei-construction-bot=Быстрый робот-строитель.
ei-advanced-logistic-bot=Высокотехнологичный логистический робот. Быстрый, с большой дальностью, переносит больше предметов.
ei-advanced-construction-bot=Высокотехнологичный робот-строитель. Быстрый, с большой дальностью, переносит больше предметов.
nuclear-reactor=Использует урановые топливные элементы для выработки тепла. Выработка тепла НЕ увеличивается при постройке рядом с другими реакторами.
ei-crystal-accumulator=Кристалл излучает энергию. Похоже, он нестабилен в течение долгого времени: при разборке устройство окажется сломанным. 
ei-crystal-accumulator-gaia=Кристалл излучает энергию. Похоже, он стабилен в течение долгого времени.
ei-resonance-synthesizer=Приумножает [item=ei-resonance-data] резонансные данные: из 1 штуки, [fluid=ei-morphium] морфиума и [fluid=ei-computing-power] вычислительной мощности получается 2. Позже также производит [item=ei-alien-resonance-pack] инопланетный резонансный пакет (только на Гайе). Вычислительная мощность — кабель данных с восточной стороны, морфиум — труба с западной.
ei-data-center=Производит [color=orange]любой исследовательский пакет[/color] — включая пакеты других модов — только из [fluid=ei-computing-power] вычислительной мощности, примерно в десять раз медленнее обычного производства.
ei-conduit=Молниеотвод, превращающий [color=orange]80 %[/color] энергии каждого пойманного удара в электричество (буфер 40 МДж, отдача до 5 МВт). Пойманные им удары не вызывают штормовой ЭМИ.
ei-void-rift-generator=Разрывает [color=purple]разлом пустоты[/color] 5x5 (край карты) прямо к югу от себя — разлом, который нужен [item=ei-void-engine] двигателям пустоты. Область должна быть свободна. Снос генератора закрывает разлом и восстанавливает исходный рельеф.
ei-data-pipe-to-ground=Подземная версия [item=ei-data-pipe] кабеля данных. Переносит только [fluid=ei-computing-power] вычислительную мощность.
ei-orbital-combinator=Отражает логистические запросы всех космических платформ на орбите этой планеты в виде сигналов. Пока у платформы есть запросы, требует [color=blue]1 единицу вычислительной мощности в минуту[/color] [fluid=ei-computing-power] через кабель данных — без неё сигналы замирают.
ei-conduit-gaia=Дремлющий пилон исчезнувшей цивилизации, который всё ещё притягивает молнии Гайи, — стройте под его защитой.
ei-radio-station=Передаёт подключённую проводами сеть сигналов всем приёмникам того же канала на этой поверхности или выдаёт в сеть принимаемый канал. Канал — любой сигнал; один передатчик на канал, приёмников сколько угодно. Потребляет [color=orange]100 кВт[/color].
ei-crystal-radio-station=Радиостанция, чьи резонирующие кристаллы достают до любой поверхности игры: каналы общие для всех планет и платформ. Потребляет [color=orange]10 МВт[/color].
ei-1x1-container=Компактный контейнер 1x1 для хранения всего, что производит колония.
