[mod-setting-description]
ei-debloat=Если включено, убирает исследовательские пакеты ранних эпох (от тёмной до компьютерной) из большинства технологий, открываемых после двигателей платформ. 
ei-em_updater_que=Показывать визуальный индикатор между ЭМ-поездами и зарядниками или над ними при передаче энергии
ei-em_updater_que_width=Радиус отображаемых колец
ei-em_updater_que_transparency=Прозрачность отображаемых колец. Диапазон 1->100 (непрозрачное)
ei-em_updater_que_timetolive=Время до исчезновения кольца
ei-em_train_glow=Включить эффект свечения ЭМ-поездов при передаче электричества
ei-em_train_glow_timetolive=Тиков до затухания свечения поезда. Может накладываться. Уменьшение числа повышает производительность. 60 тиков = 1 секунда.
ei-em_charger_glow=Включить эффект свечения ЭМ-зарядников при передаче электричества
ei-em_charger_glow_timetolive=Тиков до затухания свечения зарядника. Может накладываться. Уменьшение числа повышает производительность. 60 тиков = 1 секунда.
ei-max_updates_per_tick=Количество обновлений каждого типа сущностей за тик
ei_ticks_per_full_update=Число тиков, за которые обновляются все сущности EI
ei-loader-prototype-complexity=Включить/выключить сложные рецепты погрузчиков: экспресс-погрузчик получает фильтрацию, нео-погрузчик — укладку в стопки
ei-rocket-lift-capacity-buff=Умножает вместимость ракет и посадочных площадок в x раз. РЕКОМЕНДУЕТСЯ ЗАПУСК РАКЕТ ПО СИГНАЛУ СХЕМЫ
ei-beacon-overload=Задуманное поведение. Ограничивает число маяков, которые могут влиять на одно здание, как в Space Exploration
ei-ash=Сжигание химического топлива даёт золу, которую можно переработать, но с ней придётся что-то делать
ei-slag=Плавильни (кроме плазменного нагревателя) дают шлак, который можно переработать, но с ним придётся что-то делать
ei-gaia-storm-emp=Удары молний на Гайе, не пойманные молниеотводом, временно отключают машины, манипуляторы и комбинаторы вокруг места удара.
ei-gaia-freezing=Постройкам на Гайе нужен обогрев, как на Аквило.

