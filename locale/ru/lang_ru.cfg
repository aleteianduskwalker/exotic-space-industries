ei-insulated-pipe=Изолированная труба — особый тип трубы для транспортировки [color=red]очень горячих (плазма газов)[/color] или [color=blue]холодных жидкостей (сжиженные газы)[/color], которые иначе повредили бы трубу.
ei-insulated-underground-pipe=Изолированная труба — особый тип трубы для транспортировки [color=red]очень горячих (плазма газов)[/color] или [color=blue]холодных жидкостей (сжиженные газы)[/color], которые иначе повредили бы трубу.
ei-insulated-tank=Изолированный резервуар — особый тип резервуара для хранения [color=red]очень горячих (плазма газов)[/color] или [color=blue]холодных жидкостей (сжиженные газы)[/color], которые иначе повредили бы резервуар.
ei-cooler=Гиперохладитель переводит газы в жидкую фазу. Для транспортировки сжиженных газов используйте [color=blue]изолированные трубы[/color] [item=ei-insulated-pipe].
ei-data-pipe=Специализированный кабель данных для передачи [color=blue]вычислительной мощности[/color] [fluid=ei-computing-power].
ei-stone-quarry=Этот карьерный бур добывает [color=orange]камень[/color] [item=stone] где угодно.
ei-electric-stone-quarry=Этот карьерный бур добывает [color=orange]камень[/color] [item=stone] где угодно.
ei-deep-drill=Этот бур имеет доступ к рудным жилам. Для работы нужен [color=orange]буровой раствор 1/с[/color] [fluid=ei-drill-fluid].
ei-advanced-drill=Этот бур имеет доступ к рудным жилам. Для работы нужен [color=orange]буровой раствор 2/с[/color] [fluid=ei-drill-fluid].
ei-deep-pumpjack=Улучшенная нефтяная вышка. Также может добывать [color=blue]криофлюкс[/color][fluid=ei-cryoflux] и [color=green]фитогаз[/color][fluid=ei-phythogas].
ei-exotic-assembler=Этот сборщик производит [color=orange]экзотические предметы[/color]. Экзотическая материя очень нестабильна, поэтому его нужно ставить рядом со [color=blue]стабилизатором материи[/color], иначе он взорвётся.
ei-computer-core=Требует электричество и электронные компоненты, чтобы выдавать [color=blue]вычислительную мощность[/color] [fluid=ei-computing-power]. Подключите к нему [color=orange]кабель данных[/color] [item=ei-data-pipe].
ei-quantum-computer=Высокотехнологичный компьютер. Подавайте разные входные ресурсы, чтобы получать высокотехнологичные данные.
ei-matter-stabilizer=Рукотворный стабилизатор материи. Стабилизирует [color=orange]сборщики экзотической материи[/color] [item=ei-exotic-assembler] и не даёт им взорваться.
ei-copper-beacon=Маяк с жидкостным охлаждением. Для работы нужен [color=blue]жидкий азот 1/с[/color] [fluid=ei-liquid-nitrogen]. Считается как [color=orange]1[/color] маяк при перегрузке маяками.
ei-iron-beacon=Маяк с жидкостным охлаждением. Для работы нужен [color=blue]жидкий азот 2/с[/color] [fluid=ei-liquid-nitrogen]. Считается как [color=orange]2[/color] маяка при перегрузке маяками.
ei-induction-matrix-core=Ядро мультиструктуры индукционной матрицы. На одну матрицу можно поставить только одно ядро.
ei-induction-matrix-basic-coil=Базовая катушка мультиструктуры индукционной матрицы. Увеличивает ёмкость матрицы на [color=yellow]25 МДж[/color].
ei-induction-matrix-advanced-coil=Улучшенная катушка мультиструктуры индукционной матрицы. Увеличивает ёмкость матрицы на [color=yellow]100 МДж[/color].
ei-induction-matrix-superior-coil=Превосходная катушка мультиструктуры индукционной матрицы. Увеличивает ёмкость матрицы на [color=yellow]1000 МДж[/color].
ei-induction-matrix-basic-converter=Базовый преобразователь мультиструктуры индукционной матрицы. Увеличивает скорость передачи энергии.
ei-induction-matrix-advanced-converter=Улучшенный преобразователь мультиструктуры индукционной матрицы. Увеличивает скорость передачи энергии. Считается как [color=orange]2[/color] базовых преобразователя.
ei-induction-matrix-superior-converter=Превосходный преобразователь мультиструктуры индукционной матрицы. Увеличивает скорость передачи энергии. Поддерживается не более 4 штук. Считается как [color=orange]4[/color] базовых преобразователя.
ei-induction-matrix-basic-solenoid=Соленоид мультиструктуры индукционной матрицы. Повышает эффективность катушек, если стоит рядом с ними последовательно. Слишком много соленоидов может снизить ёмкость матрицы.
ei-fission-facility=Получайте данные о ядерном делении для разработки реакторов деления.
ei-high-temperature-reactor=Нуждается в [color=red]тепле[/color] от других реакторов. Производит много пара и может использовать топливо на основе [color=orange]тория[/color] [item=ei-thorium-232]. С [color=green]топливным стержнем урана-235[/color] [item=ei-uranium-235-fuel] выдаёт 500 МВт.
ei-castor=Храните здесь свои грязные [color=yellow]ядерные отходы[/color] [item=ei-nuclear-waste].
ei-neutron-collector=Поглощает нейтроны от их источников — ядерных реакторов, термоядерных реакторов и других — и заряжает [color=blue]нейтронные контейнеры[/color] [item=ei-charged-neutron-container]. Эффективность зависит от расстояния до источника: чем ближе, тем выше. При низкой эффективности зарядка [color=blue]нейтронного контейнера[/color] [item=ei-neutron-container] -> [item=ei-charged-neutron-container] длится дольше.
ei-neutron-activator=Насыщайте различные элементы нейтронами из [color=blue]нейтронных контейнеров[/color] [item=ei-charged-neutron-container], чтобы получать ценное термоядерное топливо.
ei-fusion-reactor=Термоядерный реактор синтеза. Синтезирует различные виды термоядерного топлива, нагревая [color=orange]жидкосвинцовый теплоноситель[/color] [fluid=ei-cold-coolant][fluid=ei-hot-coolant] для выработки энергии. Реактор может работать в разных режимах. Подробности — в вики InformaTron.
ei-gauss-module=[font=default-bold]Божественный модуль.[/font] Его можно ставить в [font=default-bold]любую машину, принимающую продуктивность[/font], без ограничений по рецептам.
ei-small-inserter=Манипулятор 2x2 с ячейками фильтра. Переносит целые стопки предметов за раз.
ei-big-inserter=Манипулятор 2x2 с ячейками фильтра. Переносит целые стопки предметов за раз с высокой скоростью.
ei-small-inserter-normal=Манипулятор 2x2. Переносит целые стопки предметов за раз.
ei-big-inserter-normal=Манипулятор 2x2. Переносит целые стопки предметов за раз с высокой скоростью.
ei-module-base=Основа модуля. Используется для создания различных модулей.
ei-photon-cavity=Резонатор для хранения фотонов.
ei-z-boson-cavity=Резонатор для хранения Z-бозонов.
ei-gluon-cavity=Резонатор для хранения глюонов.
ei-destill-tower=Ректификационная колонна, работающая на [color=red]тепле[/color]. Разделяет [color=orange]остаточную нефть[/color] [fluid=ei-residual-oil] на компоненты.
ei-advanced-destill-tower=Ректификационная колонна, работающая на [color=yellow]электричестве[/color]. Разделяет [color=orange]остаточную нефть[/color] [fluid=ei-residual-oil] на компоненты.
ei-mining-satellite=Спутник, добывающий [color=orange]планетарные камни[/color] [item=ei-moon-rock][item=ei-sulf-rock][item=ei-mars-rock][item=ei-uran-rock][item=ei-exotic-rock] в соответствующих космических пунктах назначения. За запуск всегда добывает [color=red]10.000[/color] камней.
ei-exploration-satellite=Спутник, исследующий неизведанное! Запустите его в дальний космос — возможно, найдёте что-то интересное.
ei-rocket-silo=Запускайте ракеты в космос к разным пунктам назначения. Подробности — в вики InformaTron и в интерфейсе ракетной шахты.
ei-thorium-232-fuel=Ядерное топливо на основе тория-232, работает только в [color=green]высокотемпературном реакторе[/color] [item=ei-high-temperature-reactor]. Один стержень даёт [color=orange]300 тыс. пара[/color] [fluid=steam] за 120 секунд в [color=green]высокотемпературном реакторе[/color] [item=ei-high-temperature-reactor].
ei-plutonium-239-fuel=Ядерное топливо на основе плутония-239. Один стержень даёт [color=orange]700 тыс. пара[/color] [fluid=steam] за 120 секунд в [color=green]высокотемпературном реакторе[/color] [item=ei-high-temperature-reactor].
ei-uranium-235-fuel=Ядерное топливо на основе урана-235. Один стержень даёт [color=orange]600 тыс. пара[/color] [fluid=steam] за 120 секунд в [color=green]высокотемпературном реакторе[/color] [item=ei-high-temperature-reactor].
ei-uranium-233-fuel=Ядерное топливо на основе урана-233. Один стержень даёт [color=orange]400 тыс. пара[/color] [fluid=steam] за 120 секунд в [color=green]высокотемпературном реакторе[/color] [item=ei-high-temperature-reactor].
ei-burner-inserter=Этот манипулятор сжигает топливо для перемещения предметов. Может забирать [color=orange]горючее топливо[/color] из машин, из которых извлекает.
ei-oil-refinery=Нефтеперерабатывающий завод, работающий на [color=red]тепле[/color].
ei-heat-chemical-plant=Химический завод, работающий на [color=red]тепле[/color].
ei-scanner=Сканер для анализа инопланетных артефактов. Выбор инопланетной формы жизни или артефакта запускает сканирование, дающее [color=#d43e8e]инопланетные единицы KU[/color].\n\n[color=red][ОСТОРОЖНО][/color] Сканирование уничтожает выбранную форму жизни или артефакт.

ei-space-data=Получается при запуске [color=blue]спутника[/color] [item=satellite] на [color=green]орбиту Наувиса[/color].
ei-moon-rock=Получается при запуске [color=blue]добывающего спутника[/color] [item=ei-mining-satellite] на [color=green]Луну[/color].
ei-mars-rock=Получается при запуске [color=blue]добывающего спутника[/color] [item=ei-mining-satellite] на [color=green]Марс[/color].
ei-sulf-rock=Получается при запуске [color=blue]добывающего спутника[/color] [item=ei-mining-satellite] на [color=green]серную планету[/color].
ei-uran-rock=Получается при запуске [color=blue]добывающего спутника[/color] [item=ei-mining-satellite] на [color=green]планету Уран[/color].
ei-exotic-rock=Получается при запуске [color=blue]добывающего спутника[/color] [item=ei-mining-satellite] на [color=green]астероид[/color].
ei-black-hole-data=Получается при запуске [color=blue]спутника наблюдения[/color] [item=ei-watch-satellite] на [color=green]орбиту чёрной дыры[/color].

