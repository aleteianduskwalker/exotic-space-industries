ei-advanced-deep-drill=Этот бур имеет доступ к рудным жилам. Для работы нужен [color=orange]буровой раствор 2/с[/color] [fluid=ei-drill-fluid].
ei-advanced-destill-tower=Ректификационная колонна, работающая на [color=yellow]электричестве[/color]. Разделяет [color=orange]остаточную нефть[/color] [fluid=ei-residual-oil] на компоненты.
ei-alien-flowers-1=Подозрительная инопланетная жизнь. Поставьте её и [color=orange]подстрелите[/color], чтобы получить добычу.
ei-arc-furnace=Энергоёмкая печь, выдающая жидкий металл. Требует [color=red]30 МВт[/color].
ei-basic-heat-pipe=Тепловая труба малой ёмкости. Переносит тепло медленно и в небольших количествах. Выдерживает до [color=red]275 градусов[/color].
ei-big-inserter-normal=Манипулятор 2x2. Переносит целые стопки предметов за раз с высокой скоростью.
ei-bio-chamber=Биокамера для выращивания инопланетных растений.
ei-bio-reactor=Биореактор для работы с инопланетной органикой.
ei-burner-assembler=Самый простой сборщик на [color=orange]горючем топливе[/color]. [color=brown]Твердотопливные манипуляторы[/color][item=burner-inserter] также могут брать топливо из этой машины.
ei-burner-heater=Сжигает [color=orange]горючие предметы[/color], вырабатывая [color=red]тепло[/color].
ei-caster=Отливайте здесь любимые слитки[item=iron-plate][item=copper-plate][item=steel-plate][item=ei-gold-ingot][item=ei-lead-ingot][item=ei-neodym-ingot][item=ei-glass].
ei-castor=Храните здесь свои грязные [color=yellow]ядерные отходы[/color] [item=ei-nuclear-waste].
ei-combustion-turbine=Высокоэффективная компактная турбина с повышенным КПД.
ei-computer-core=Требует электричество и электронные компоненты, чтобы выдавать [color=blue]вычислительную мощность[/color] [fluid=ei-computing-power]. Подключите к нему [color=orange]кабель данных[/color] [item=ei-data-pipe].
ei-cooler=Гиперохладитель переводит газы в жидкую фазу. Для транспортировки сжиженных газов используйте [color=blue]изолированные трубы[/color] [item=ei-insulated-pipe].
ei-copper-beacon=Маяк с жидкостным охлаждением. Для работы нужен [color=blue]жидкий азот 1/с[/color] [fluid=ei-liquid-nitrogen]. Считается как [color=orange]1[/color] маяк при перегрузке маяками.
ei-crusher=Дробит руду для повышения выхода, дробит слитки для переработки, может давать [item=ei-exotic-ore][color=purple]экзотическую руду[/color] из кусков прометия.
ei-data-pipe=Специализированный кабель данных для передачи [color=blue]вычислительной мощности[/color] [fluid=ei-computing-power].
ei-deep-drill=Этот бур имеет доступ к рудным жилам. Для работы нужен [color=orange]буровой раствор 1/с[/color] [fluid=ei-drill-fluid].
ei-deep-pumpjack=Улучшенная нефтяная вышка. Также может добывать [color=blue]криофлюкс[/color][fluid=ei-cryoflux] и [color=green]фитогаз[/color][fluid=ei-phythogas].
ei-destill-tower=Ректификационная колонна, работающая на [color=red]тепле[/color]. Разделяет [color=orange]остаточную нефть[/color] [fluid=ei-residual-oil] на компоненты.
ei-excavator=Потребляет [color=blue]воду[/color][fluid=water], производя [color=orange]15/с камня[/color][item=stone] и [color=brown]грязную воду[/color][fluid=ei-dirty-water].
ei-exotic-assembler=Этот сборщик производит [color=orange]экзотические предметы[/color]. Экзотическая материя очень нестабильна, поэтому его нужно ставить рядом со [color=blue]стабилизатором материи[/color], иначе он взорвётся.
ei-fission-facility=Получайте данные о ядерном делении для разработки реакторов деления.
ei-fluid-boiler=Вырабатывает пар, сжигая:
ei-fluid-heater=Вырабатывает тепло, сжигая:
ei-fusion-reactor=Термоядерный реактор синтеза. Синтезирует различные виды термоядерного топлива, нагревая [color=orange]жидкосвинцовый теплоноситель[/color] [fluid=ei-cold-coolant][fluid=ei-hot-coolant] для выработки энергии. Реактор может работать в разных режимах. Подробности — в вики InformaTron.
ei-gaia-pump=Прибрежный насос, созданный для Гайи.
ei-gate=Междумерные врата, построенные по древним инопланетным данным. Ведут в точку между измерениями. \n[color=red][ПРИМЕЧАНИЕ][/color] Не переносят живых существ, только предметы.
ei-grower=Выращивайте и собирайте [color=green]энергетические кристаллы[/color][item=ei-energy-crystal][item=ei-high-energy-crystal][item=ei-enriched-cryodust]. Подходит и для разведения рыбы!
ei-heat-chemical-plant=Химический завод, работающий на [color=red]тепле[/color].
ei-high-temperature-reactor=Нуждается в [color=red]тепле[/color] от других реакторов. Производит много пара и может использовать топливо на основе [color=orange]тория[/color] [item=ei-thorium-232]. С [color=green]топливным стержнем урана-235[/color] [item=ei-uranium-235-fuel] выдаёт 500 МВт.
ei-holo-asteroid=Декоративный голографический дисплей.
ei-holo-gas-giant=Декоративный голографический дисплей.
