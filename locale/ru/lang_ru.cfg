biolab=Для работы нужны [item=nutrients]питательные вещества.
ei-burner-heater=Сжигает [color=orange]горючие предметы[/color], вырабатывая [color=red]тепло[/color].
ei-combustion-turbine=Высокоэффективная компактная турбина с повышенным КПД.
ei-arc-furnace=Энергоёмкая печь, выдающая жидкий металл. Требует [color=red]30 МВт[/color].
ei-purifier=Обрабатывает и очищает куски руды, извлекает примеси, повышает чистоту растворов или сбрасывает лишнюю воду в атмосферу
ei-crusher=Дробит руду для повышения выхода, дробит слитки для переработки, может давать [item=ei-exotic-ore][color=purple]экзотическую руду[/color] из кусков прометия.
ei-basic-heat-pipe=Тепловая труба малой ёмкости. Переносит тепло медленно и в небольших количествах. Выдерживает до [color=red]275 градусов[/color].
ei-advanced-deep-drill=Этот бур имеет доступ к рудным жилам. Для работы нужен [color=orange]буровой раствор 2/с[/color] [fluid=ei-drill-fluid].
ei-burner-assembler=Самый простой сборщик на [color=orange]горючем топливе[/color]. [color=brown]Твердотопливные манипуляторы[/color][item=burner-inserter] также могут брать топливо из этой машины.
ei-steam-assembler=Сборщик на паровой тяге. Пропускает через себя [color=orange]пар[/color][fluid=steam], нужный для питания. Рецептам, которым пар нужен как ингредиент, потребуется отдельная паровая труба.
ei-steam-crusher=Дробилка на паровой тяге. Пропускает через себя [color=orange]пар[/color][fluid=steam], нужный для питания.
ei-waver-factory=Производите на этой машине высококачественные [color=orange]полупроводники[/color][item=ei-semiconductor][item=ei-advanced-semiconductor].
ei-caster=Отливайте здесь любимые слитки[item=iron-plate][item=copper-plate][item=steel-plate][item=ei-gold-ingot][item=ei-lead-ingot][item=ei-neodym-ingot][item=ei-glass].
ei-lufter=Извлекает газы из атмосферы и выпускает их обратно.
ei-grower=Выращивайте и собирайте [color=green]энергетические кристаллы[/color][item=ei-energy-crystal][item=ei-high-energy-crystal][item=ei-enriched-cryodust]. Подходит и для разведения рыбы!
ei-plasma-heater=Нагревает газы и превращает их в плазму. Потребляет много энергии, может также плавить.
ei-nano-factory=Высокотехнологичное производство и обработка материалов.
ei-bio-chamber=Биокамера для выращивания инопланетных растений.
ei-bio-reactor=Биореактор для работы с инопланетной органикой.
ei-alien-console=Механизм для работы с древними инопланетными данными. После постройки открывает страницу инопланетных данных в вики InformaTron.
ei-gate=Междумерные врата, построенные по древним инопланетным данным. Ведут в точку между измерениями. \n[color=red][ПРИМЕЧАНИЕ][/color] Не переносят живых существ, только предметы.
ei-gate-container=Междумерные врата, построенные по древним инопланетным знаниям. Ведут в точку между измерениями. \n[color=red][ПРИМЕЧАНИЕ][/color] Не переносят живых существ, только предметы.
ei-drone-port=Управляйте с этого порта одним [color=blue]дроном[/color][entity=ei-drone]. У дрона свой инвентарь, он может ставить постройки, но не умеет сражаться.
ei-crystal-accumulator-repair=Набор для ремонта сломанных кристаллических аккумуляторов. Проведите им над аккумулятором, как обычным инструментом выделения. Ремонт рассыпает вокруг артефакта [item=ei-resonance-data] резонансные данные и даёт инопланетные знания — подберите их!
ei-farstation-repair=Набор для ремонта сломанных дальних станций. Проведите им над станцией, как обычным инструментом выделения. Ремонт рассыпает вокруг артефакта [item=ei-resonance-data] резонансные данные и даёт инопланетные знания — подберите их!
ei-alien-beacon-repair=Набор для ремонта сломанных инопланетных маяков. Проведите им над маяком, как обычным инструментом выделения. Ремонт рассыпает вокруг артефакта [item=ei-resonance-data] резонансные данные и даёт инопланетные знания — подберите их!
ei-gaia-pump=Прибрежный насос, созданный для Гайи.

ei-alien-flowers-1=Подозрительная инопланетная жизнь. Поставьте её и [color=orange]подстрелите[/color], чтобы получить добычу.
ei-resonance-data=Древние резонансные узоры. Высыпаются из каждого отремонтированного инопланетного артефакта; позже синтезируются в [item=ei-resonance-synthesizer] резонансном синтезаторе.
ei-alien-resonance-pack=Второй уровень инопланетной науки. Производится в [item=ei-resonance-synthesizer] резонансном синтезаторе на Гайе; используется инопланетным древом технологий и [item=ei-void-rift-generator] генератором разлома пустоты.
ei-orbital-combinator=Отражает логистические запросы всех космических платформ на орбите этой планеты в виде сигналов. Пока у платформы есть запросы, требует [color=blue]1 единицу вычислительной мощности в минуту[/color] [fluid=ei-computing-power] через кабель данных — без неё сигналы замирают.
ei-data-pipe-to-ground=Подземная версия [item=ei-data-pipe] кабеля данных. Переносит только [fluid=ei-computing-power] вычислительную мощность.

