ei-tank-1=Соотношение объём:железо 600:1. 1000 здоровья, сопротивление: 30% физ., 60% [color=red]огонь[/color], 60% удар.
ei-tank-2=Соотношение объём:железо 666:1. 1500 здоровья, сопротивление: 40% физ., 70% [color=red]огонь[/color], 70% удар.
